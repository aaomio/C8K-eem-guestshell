event manager applet Default_Route
 event syslog pattern "%OSPF-5-ADJCHG"
 action 1.0 puts "OSPF Adjacency Change Detected - Checking OSPF status"
 action 2.0 cli command "enable"
 action 3.0 cli command "guestshell run python3 Py/backup_route.py"
 action 4.0 puts "Python script executed successfully"
 action 5.0 syslog msg "New default route installed by EEM applet"